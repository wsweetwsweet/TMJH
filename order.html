<style id="tmjh-style">
/* Layout: one column app, sticky tab bar, cards only for menus/orders; bento-box jade + bamboo yellow */
:root {
  --bg: #f3f6f2; --surface: #ffffff; --surface-2: #e8eee7; --line: #d3ddd2;
  --fg: #1d2a22; --muted: #5d6e63; --accent: #1f7a55; --accent-fg: #ffffff;
  --accent-soft: #d8ede2; --gold: #c99a1e; --gold-soft: #f6ecd0; --danger: #b8402f; --danger-soft: #f6dcd7;
  --f-display: "Huninn", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a15; --surface: #1a241e; --surface-2: #233029; --line: #314037;
  --fg: #e4ece6; --muted: #9aaba0; --accent: #4fbf8c; --accent-fg: #0d1a13;
  --accent-soft: #1f3a2d; --gold: #e3b84a; --gold-soft: #3a3120; --danger: #ef7f6c; --danger-soft: #3d2420; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a15; --surface: #1a241e; --surface-2: #233029; --line: #314037;
  --fg: #e4ece6; --muted: #9aaba0; --accent: #4fbf8c; --accent-fg: #0d1a13;
  --accent-soft: #1f3a2d; --gold: #e3b84a; --gold-soft: #3a3120; --danger: #ef7f6c; --danger-soft: #3d2420; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; }
.brand-mark i { background: var(--accent-fg); opacity: .85; border-radius: 2px; }
.brand-mark i:first-child { grid-row: span 2; background: var(--gold); opacity: 1; }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
nav.tabs button { white-space: nowrap;  border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
main { padding-block: 20px 60px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.3; }
h2 { font-size: 22px; } h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn { white-space: nowrap; font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.btn.danger { color: var(--danger); border-color: var(--danger-soft); }

.price { font-variant-numeric: tabular-nums; font-weight: 700; }

.menu-switch { display: flex; gap: 8px; flex-wrap: wrap; }

.menu-switch button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }

.item:hover { border-color: var(--accent); }
.item[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.item .price { color: var(--accent); white-space: nowrap; }

.opt-group { display: grid; gap: 6px; }
.opt-group legend { font-weight: 500; padding: 0; margin-bottom: 4px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: inline-flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; background: var(--surface); }
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt small { opacity: .8; }
.total-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 12px; }
.total-bar .price { font-size: 22px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qty button { border: 0; background: var(--surface-2); color: var(--fg); width: 32px; height: 32px; font-size: 18px; cursor: pointer; }
.qty input { width: 44px; border: 0; text-align: center; border-radius: 0; background: var(--surface); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .05em; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; border-bottom: 0; }
.edit-tbl input { width: 100%; }
.edit-tbl td { padding: 4px; }

/* upload */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 24px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; cursor: pointer; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.og { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.og-head { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
.choice-row { display: grid; grid-template-columns: 1fr 90px auto; gap: 6px; }
@media (max-width: 520px) { .og-head { grid-template-columns: 1fr 1fr; } .og-head input[type=text] { grid-column: 1 / -1; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 20; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
.order-pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0; font-family: ui-monospace, monospace; }
#copy-fallback { font-size: 12px; }
details summary { list-style-position: inside; }
</style>

};

const S = {

};

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function copyText(text, okMsg) {
  const fallback = () => { const ta = $("#copy-fallback"); if (ta) { ta.hidden = false; ta.value = text; ta.select(); } toast("請長按選取文字後複製"); };
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch { fallback(); }
}

  return [...g.entries()];
}
const itemBase = it => it.variants && it.variants.length ? Math.min(...it.variants.map(v => +v.price || 0)) : (+it.price || 0);
const clean = s => String(s || "").replace(/[｜|\n\r]/g, "/").trim();
function selPrice(m, s) {

  const opts = [];
  (m.options || []).forEach(g => (s.opts[g.id] || []).forEach(cn => { const c = g.choices.find(x => x.name === cn); if (c) { unit += +c.price || 0; opts.push(c.name + (+c.price ? "+" + c.price : "")); } }));
  return { unit, opts, it };
}
const cartTotal = () => S.cart.reduce((a, c) => a + c.unit * c.qty, 0);
function orderLines() {
  const m = menuById(S.orderMenuId);
  return S.cart.map(c => [MARK + clean(m.name), clean(S.name), clean(c.item) + (c.variant ? `（${clean(c.variant)}）` : ""), c.opts.length ? c.opts.map(clean).join("、") : "無", c.note ? "備註：" + clean(c.note) : "", "×" + c.qty, "$" + c.unit * c.qty].filter(Boolean).join("｜"));
}

// order-line parser for the tally tab
function parseOrders(text) {
  const out = [];
  String(text || "").split(/\r?\n/).forEach(line => {
    const i = line.indexOf(MARK); if (i < 0) return;
    const parts = line.slice(i + MARK.length).replace(/["”]+\s*$/, "").split("｜").map(s => s.trim());
    if (parts.length < 4) return;
    const r = { menu: parts[0], name: parts[1], item: parts[2], variant: "", opts: "", note: "", qty: 1, total: 0 };
    const vm = r.item.match(/^(.*)（(.+)）$/); if (vm) { r.item = vm[1]; r.variant = vm[2]; }
    parts.slice(3).forEach(p => {
      let m;
      if ((m = p.match(/^[×xX*]\s*(\d+)/))) r.qty = +m[1];
      else if ((m = p.match(/^(?:NT)?\$\s*(\d+)/))) r.total = +m[1];
      else if (p.startsWith("備註：")) r.note = p.slice(3);
      else if (p !== "無") r.opts = p;
    });
    out.push(r);
  });
  return out;
}
const rowKey = r => [r.menu, r.name, r.item, r.variant, r.opts, r.note, r.qty, r.total].join("|");

function aggregate(rows) {
  const agg = new Map(), people = new Map();
  rows.forEach(o => {
    const k = [o.item, o.variant, o.opts, o.note].join("|");
    const a = agg.get(k) || { ...o, qty: 0, sum: 0 }; a.qty += o.qty; a.sum += o.total; agg.set(k, a);
    const p = people.get(o.name) || { qty: 0, sum: 0 }; p.qty += o.qty; p.sum += o.total; people.set(o.name, p);
  });
  return { agg: [...agg.values()], people: [...people.entries()].sort((a, b) => a[0].localeCompare(b[0], "zh-Hant", { numeric: true })) };
}

}

// ---------- draft helpers ----------
const varText = v => (v || []).map(x => `${x.name}:${x.price}`).join(", ");
function parseVariants(t) {
  return String(t || "").split(/[,，、]/).map(s => s.trim()).filter(Boolean).map(s => { const m = s.match(/^(.+?)\s*[:：=]\s*(\d+)/); return m ? { name: m[1].trim(), price: +m[2] } : null; }).filter(Boolean);
}
const cloneDefaults = type => JSON.parse(JSON.stringify(DEFAULT_OPTIONS[type] || [])).map(g => ({ ...g, id: uid() }));
function toDraft(m) {
  return { id: m.id || null, name: m.name || "", type: m.type || "bento", deadline: m.deadline || "", note: m.note || "", open: !!m.open, aiNote: m.aiNote || "",
    items: (m.items || []).map(it => ({ id: it.id || uid(), category: it.category || "", name: it.name || "", price: it.price ?? "", variantsText: varText(it.variants) })),
    options: (m.options || []).map(g => ({ id: g.id || uid(), name: g.name || "", multi: !!g.multi, required: !!g.required, choices: (g.choices || []).map(c => ({ name: c.name || "", price: +c.price || 0 })) })) };
}
function fromDraft(d) {
  return { id: d.id || uid(), name: d.name.trim() || "未命名菜單", type: d.type, deadline: d.deadline.trim(), note: d.note.trim(), open: d.open,
    items: d.items.filter(it => it.name.trim()).map(it => { const v = parseVariants(it.variantsText); return { id: it.id, category: it.category.trim(), name: it.name.trim(), price: +it.price || (v[0] ? v[0].price : 0), variants: v }; }),
    options: d.options.filter(g => g.name.trim()).map(g => ({ id: g.id, name: g.name.trim(), multi: g.multi, required: g.required, choices: g.choices.filter(c => c.name.trim()).map(c => ({ name: c.name.trim(), price: +c.price || 0 })) })).filter(g => g.choices.length) };
}

// ---------- saving: the page republishes itself with the menus inside ----------
function buildDoc(menus) {
  const data = JSON.stringify({ menus }).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>TMJH 訂餐站</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + FONTS
    + '<style id="tmjh-style">' + document.getElementById("tmjh-style").textContent + '</style>\n'
    + '<div id="tmjh-root"></div>\n'
    + '<script type="application/json" id="tmjh-data">' + data + '<\/script>\n'
    + '<script id="tmjh-app">' + document.getElementById("tmjh-app").textContent + '<\/script>'
    + '</body></html>';
}
async function persist(menus, okMsg) {
  if (!S.artifact) { toast("無法儲存：請在 claude.ai 登入後開啟這個頁面"); return false; }
  S.saving = true; render();
  try {
    await S.artifact.publish(buildDoc(menus));
    S.menus = menus; toast(okMsg); S.saving = false; return true;
  } catch (e) {
    S.saving = false; render();
    toast(e && e.code === "conflict" ? "頁面剛被更新，請重新操作一次" : "儲存失敗：" + ((e && (e.message || e.code)) || "請再試一次"));
    return false;
  }
}

// ---------- recognition (uses the owner's claude.ai account, no API key) ----------
function addFiles(list) { [...list].filter(f => f.type.startsWith("image/")).forEach(f => S.files.push({ file: f, url: URL.createObjectURL(f) })); S.recogError = ""; render(); }
function shrink(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}
async function recognize() {
  if (!S.sample || !S.files.length) return;
  const forced = $("#ai-type").value;
  S.recognizing = true; S.recogError = ""; render();
  try {
    const blobs = await Promise.all(S.files.map(f => shrink(f.file)));
    const prompt = `你是台灣餐飲菜單辨識助手。請閱讀附上的菜單照片（可能多張，屬於同一家店），把所有可點的品項整理成 JSON。
規則：
- 只輸出 JSON，不要任何說明文字。
- 價格用新台幣整數。看不清楚的價格填 0。
- 同一品項有多種尺寸／價格（例如中杯 M、大杯 L，或小/大份）時，放在 variants 陣列，price 填最低價；只有一種價格時 variants 給空陣列。
- category 用菜單上的分類（例如：招牌便當、炸物、茶類、奶茶、鮮奶），沒有分類就填「主餐」或「飲品」。
- addons：菜單上明確列出的加購／加料／升級項目（例如：加珍珠 +10、加蛋 +10、升級套餐 +30），沒有就給空陣列。
- type：便當／餐點類填 "bento"，飲料店填 "drink"。${forced !== "auto" ? `本菜單已確定是 "${forced}"。` : ""}
- store：店名（看得到的話），否則空字串。
格式：
{"store":"","type":"bento","items":[{"category":"","name":"","price":0,"variants":[{"name":"M","price":0}]}],"addons":[{"group":"加料","name":"珍珠","price":10}]}`;
    const r = await S.sample.json(prompt, { images: blobs, modelTier: "complex", cache: false });
    if (!r || !Array.isArray(r.items) || !r.items.length) throw { message: "沒有辨識到品項，請換一張更清楚、正面拍攝的照片再試一次。" };
    const type = forced !== "auto" ? forced : (r.type === "drink" ? "drink" : "bento");
    const options = cloneDefaults(type);
    const addons = Array.isArray(r.addons) ? r.addons.filter(a => a && a.name) : [];
    const byGroup = new Map();
    addons.forEach(a => { const g = String(a.group || "加購").trim(); if (!byGroup.has(g)) byGroup.set(g, []); byGroup.get(g).push({ name: String(a.name).trim(), price: +a.price || 0 }); });
    byGroup.forEach((choices, name) => {
      const ex = options.find(o => o.name === name);
      if (ex) ex.choices = choices; else options.push({ id: uid(), name: "店家" + (name.startsWith("加") || name.includes("升級") ? "" : "加購・") + name, multi: true, required: false, choices });
    });
    S.draft = toDraft({ name: r.store || "", type, open: true, options,
      items: r.items.filter(i => i && i.name).map(i => ({ category: i.category, name: i.name, price: +i.price || 0, variants: Array.isArray(i.variants) ? i.variants.filter(v => v && v.name).map(v => ({ name: String(v.name), price: +v.price || 0 })) : [] })),
      aiNote: `辨識出 ${r.items.length} 個品項${addons.length ? `、${addons.length} 個店家加購項目` : ""}。請核對品名與價格，調整升級選項後按「儲存菜單」。` });
    S.files.forEach(f => URL.revokeObjectURL(f.url)); S.files = [];
  } catch (e) {
    S.recogError = e && e.code === "not_granted" ? "沒有允許這個頁面使用 Claude，可以改用手動建立。" : e && e.code === "rate_limited" ? "辨識次數太頻繁，請稍等一分鐘再試。" : "辨識失敗：" + ((e && e.message) || "請再試一次");
  }
  S.recognizing = false; render();
}

// ---------- events ----------
function scrollToId(id) { requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }); }

document.addEventListener("click", async e => {
  const tab = e.target.closest("#tabs button");
  if (tab) { S.tab = tab.dataset.tab; S.confirmDel = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT" || b.tagName === "SELECT") return;
  const a = b.dataset.act, d = S.draft;
  switch (a) {
    case "goto": S.tab = b.dataset.tab; break;
    case "pickmenu": S.orderMenuId = b.dataset.id; S.sel = null; S.cart = []; S.sentText = ""; break;
    case "pickitem": {
      const m = menuById(S.orderMenuId), it = m.items.find(x => x.id === b.dataset.id);
      S.sel = { itemId: it.id, variant: it.variants && it.variants.length === 1 ? it.variants[0].name : null, opts: {}, qty: 1, note: "" };
      (m.options || []).forEach(g => { if (g.required && !g.multi && g.choices[0]) S.sel.opts[g.id] = [g.choices[0].name]; });
      render(); scrollToId("custom"); return;
    }
    case "qty": S.sel.qty = Math.max(1, S.sel.qty + +b.dataset.d); break;
    case "addcart": {
      const m = menuById(S.orderMenuId), s = S.sel, p = selPrice(m, s);
      if (p.it.variants && p.it.variants.length && !s.variant) { toast("請選擇尺寸／規格"); return; }
      for (const g of m.options || []) if (g.required && !(s.opts[g.id] || []).length) { toast(`請選擇「${g.name}」`); return; }
      const c = { item: p.it.name, variant: s.variant || "", opts: p.opts, note: s.note.trim(), unit: p.unit, qty: s.qty };
      const same = S.cart.find(x => x.item === c.item && x.variant === c.variant && x.opts.join() === c.opts.join() && x.note === c.note);
      if (same) same.qty += c.qty; else S.cart.push(c);
      S.sel = null; S.sentText = ""; toast("已加入清單"); render(); scrollToId("cart"); return;
    }
    case "delcart": S.cart.splice(+b.dataset.i, 1); break;
    case "sendline": case "copyorder": {
      if (!S.name.trim()) { toast("請填寫訂購人"); const n = $("#o-name"); if (n) n.focus(); return; }
      store.set("tmjh-name", S.name.trim());
      const text = orderLines().join("\n");
      S.sentText = text;
      if (a === "copyorder") { copyText(text, "已複製，請貼到 LINE 群組"); render(); return; }
      render();
      const link = document.createElement("a");
      link.href = "https://line.me/R/share?text=" + encodeURIComponent(text); link.target = "_blank"; link.rel = "noopener";
      document.body.appendChild(link); link.click(); link.remove();
      return;
    }
    case "newcart": S.cart = []; S.sentText = ""; S.sel = null; window.scrollTo(0, 0); break;
    // tally
    case "addtally": {
      const rows = parseOrders($("#tally-paste").value);
      if (!rows.length) { S.pasteMsg = `沒有找到訂單。訂單文字會以「${MARK}」開頭，請確認有整段複製。`; break; }
      const have = new Set(S.tally.map(rowKey)); let added = 0, dup = 0;
      rows.forEach(r => { const k = rowKey(r); if (have.has(k)) dup++; else { have.add(k); S.tally.push(r); added++; } });
      store.set("tmjh-tally", JSON.stringify(S.tally));
      S.tallyMenu = rows[rows.length - 1].menu;
      S.pasteMsg = `加入 ${added} 筆訂單${dup ? `，略過 ${dup} 筆重複` : ""}。`; break;
    }
    case "deltally": S.tally.splice(+b.dataset.i, 1); store.set("tmjh-tally", JSON.stringify(S.tally)); break;
    case "askcleartally": S.confirmDel = "tally"; break;
    case "cleartally": S.tally = []; store.set("tmjh-tally", "[]"); S.confirmDel = null; S.pasteMsg = ""; break;
    case "copystore": {
      const rows = S.tally.filter(r => r.menu === S.tallyMenu), { agg } = aggregate(rows);
      const text = `【${S.tallyMenu}】訂購清單\n` + agg.map(x => `${x.item}${x.variant ? `（${x.variant}）` : ""}${x.opts ? ` ${x.opts}` : ""}${x.note ? ` [${x.note}]` : ""} × ${x.qty}`).join("\n")
        + `\n共 ${rows.reduce((s, o) => s + o.qty, 0)} 份，總金額 ${money(rows.reduce((s, o) => s + o.total, 0))}`;
      copyText(text, "已複製叫餐清單"); return;
    }
    // admin
    case "recognize": return recognize();
    case "clearfiles": S.files.forEach(f => URL.revokeObjectURL(f.url)); S.files = []; S.recogError = ""; break;
    case "newmenu": S.draft = toDraft({ type: b.dataset.type, open: true, items: [{ category: b.dataset.type === "drink" ? "茶類" : "主餐", name: "", price: "" }], options: cloneDefaults(b.dataset.type) }); break;
    case "editmenu": S.draft = toDraft(menuById(b.dataset.id)); S.confirmDel = null; window.scrollTo(0, 0); break;
    case "toggleopen": { const menus = S.menus.map(m => m.id === b.dataset.id ? { ...m, open: !m.open } : m); const was = menuById(b.dataset.id).open; if (await persist(menus, was ? "已關閉點餐" : "已開放點餐")) render(); return; }
    case "canceledit": S.draft = null; S.confirmDel = null; break;
    case "savemenu": {
      const m = fromDraft(d);
      if (!m.items.length) { toast("至少需要一個品項"); return; }
      const menus = S.menus.some(x => x.id === m.id) ? S.menus.map(x => x.id === m.id ? m : x) : [m, ...S.menus];
      if (await persist(menus, "已儲存菜單")) { S.draft = null; S.confirmDel = null; render(); }
      return;
    }
    case "additem": d.items.push({ id: uid(), category: d.items.length ? d.items[d.items.length - 1].category : "", name: "", price: "", variantsText: "" }); break;
    case "delitem": d.items.splice(+b.dataset.i, 1); break;
    case "addgroup": d.options.push({ id: uid(), name: "", multi: false, required: false, choices: [{ name: "", price: 0 }] }); break;
    case "delgroup": d.options.splice(+b.dataset.gi, 1); break;
    case "addchoice": d.options[+b.dataset.gi].choices.push({ name: "", price: 0 }); break;
    case "delchoice": d.options[+b.dataset.gi].choices.splice(+b.dataset.ci, 1); break;
    case "loaddefaults": { const names = new Set(d.options.map(g => g.name)); cloneDefaults(d.type).forEach(g => { if (!names.has(g.name)) d.options.push(g); }); toast("已加入預設選項"); break; }
    case "askdelmenu": S.confirmDel = "menu"; break;
    case "delmenu": { if (await persist(S.menus.filter(x => x.id !== d.id), "已刪除菜單")) { S.draft = null; S.confirmDel = null; render(); } return; }
    case "canceldel": S.confirmDel = null; break;
    default: return;
  }
  render();
});

document.addEventListener("change", e => {
  const t = e.target, a = t.dataset.act;
  if (a === "variant") { S.sel.variant = t.value; return softTotal(); }
  if (a === "opt") {
    const g = menuById(S.orderMenuId).options.find(x => x.id === t.dataset.g);
    if (g.multi) { const cur = new Set(S.sel.opts[g.id] || []); t.checked ? cur.add(t.value) : cur.delete(t.value); S.sel.opts[g.id] = [...cur]; }
    else S.sel.opts[g.id] = [t.value];
    return softTotal();
  }
  if (a === "qtyset") { S.sel.qty = Math.max(1, parseInt(t.value) || 1); return softTotal(); }
  if (a === "tallymenu") { S.tallyMenu = t.value; return render(); }
  if (a === "files") { addFiles(t.files); t.value = ""; return; }
  if (S.draft && t.dataset.bind === "type") { S.draft.type = t.value; return render(); }
  if (S.draft && t.type === "checkbox") bindDraft(t);
});
document.addEventListener("input", e => {
  const t = e.target, a = t.dataset.act;
  if (a === "note") S.sel.note = t.value;
  else if (a === "name") S.name = t.value;
  else if (S.draft && t.type !== "checkbox") bindDraft(t);
});
function bindDraft(t) {
  const d = S.draft, v = t.type === "checkbox" ? t.checked : t.value;
  if (t.dataset.bind) d[t.dataset.bind] = v;
  else if (t.dataset.item != null) d.items[+t.dataset.item][t.dataset.f] = v;
  else if (t.dataset.c != null) d.options[+t.dataset.g].choices[+t.dataset.c][t.dataset.f] = v;
  else if (t.dataset.g != null) d.options[+t.dataset.g][t.dataset.f] = v;
}
function softTotal() { const m = menuById(S.orderMenuId), p = selPrice(m, S.sel), el = $("#o-total"); if (el) el.textContent = money(p.unit * S.sel.qty); }

document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files); } });

// ---------- boot ----------
render();
if (window.claude && claude.use) {
  Promise.all([claude.use("user"), claude.use("artifact"), claude.use("sample")]).then(async ([user, artifact, sample]) => {
    let owner = false;
    try { owner = user ? !!(await user.canEdit()) : false; } catch {}
    if (!owner) return;
    S.isOwner = true; S.artifact = artifact; S.sample = sample;
    if (!S.menus.length) S.tab = "admin";
    render();
  });
}
})();
</script></body></html>
